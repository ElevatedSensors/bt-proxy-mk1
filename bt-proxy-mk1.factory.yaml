packages:
  bt-proxy-mk1: !include bt-proxy-mk1.yaml
  esphome-common:
    url: https://github.com/ElevatedSensors/esphome-common
    ref: main
    refresh: always
    files:
      - wifi-management.yaml

esphome:
  project:
    name: ElevatedSensors.BTProxyMk1Factory
    version: dev # This will be replaced by the github workflows with the `release` version

# Allow ESPHome Adoption
dashboard_import:
  package_import_url: https://github.com/ElevatedSensors/bt-proxy-mk1/bt-proxy-mk1.yaml
  import_full_config: true

# Allow provisioning WiFi credentials via serial
improv_serial:

# Allow provisioning WiFi credentials via Bluetooth
esp32_improv:
  authorizer: none

# Managed updates from ElevatedSensors
ota:
  - platform: http_request
    id: ota_http_request

update:
  - platform: http_request
    id: update_http_request
    name: Firmware
    source: https://docs.elevatedsensors.com/firmware/bt-proxy-mk1/latest/bt-proxy-mk1.manifest.json
    update_interval: 25h

http_request:
  verify_ssl: true